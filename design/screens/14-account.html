<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A12}
a{color:#FFD60A}a:hover{color:#FFE680}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #0B0A12; font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden">

  <header style="padding: 12px 14px 0; display: flex; align-items: center; gap: 10px">
    <a href="10-home.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid #3B2758; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F2FA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bungee', 'Bricolage Grotesque', sans-serif; font-weight: 400; font-size: 26px; font-weight: 800">My account</h1>
  </header>

  <section style="margin: 16px 16px 0; background: #FF4FD8; color: #0B0A12; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: 5px 5px 0 #FFD60A">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="position: relative; flex: none">
        <span style="width: 72px; height: 72px; border-radius: 22px; background: #0B0A12; color: #FF4FD8; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; transform: rotate(-4deg)">AK</span>
        <button aria-label="Change photo" style="position: absolute; right: -6px; bottom: -6px; width: 30px; height: 30px; border-radius: 10px; border: 2px solid #FF4FD8; background: #FFD60A; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0B0A12" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800; line-height: 1">Asha Kumar</span>
        <span style="font-size: 13px; font-weight: 600">asha.k@gmail.com</span>
        <span style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px"><span style="font-size: 11px; font-weight: 800; background: #0B0A12; color: #FFD60A; padding: 3px 8px; border-radius: 999px">STUDENT</span><span style="font-size: 11px; font-weight: 800; background: rgba(11,10,18,0.15); padding: 3px 8px; border-radius: 999px">ECE · 2nd year</span></span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; background: #0B0A12; color: #F4F2FA; border-radius: 18px; padding: 12px">
      <div style="display: flex; flex-direction: column; align-items: center"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; color: #FFD60A">4/10</span><span style="font-size: 11px; font-weight: 700; color: #BDB8CF">stamps</span></div>
      <div style="display: flex; flex-direction: column; align-items: center"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">#7</span><span style="font-size: 11px; font-weight: 700; color: #BDB8CF">hunt rank</span></div>
      <div style="display: flex; flex-direction: column; align-items: center"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">3</span><span style="font-size: 11px; font-weight: 700; color: #BDB8CF">votes cast</span></div>
    </div>
  </section>

  <nav aria-label="Account settings" style="margin: 18px 16px 0; background: #1F1230; border: 1.5px solid #3B2758; border-radius: 22px; overflow: hidden">
    <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; color: #F4F2FA; text-decoration: none; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span style="flex: 1">Edit name, department, photo</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8599" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid #3B2758; color: #F4F2FA; text-decoration: none; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFE14D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg><span style="flex: 1">Change password</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8599" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid #3B2758; font-size: 15px; font-weight: 600; min-height: 48px; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9B6CFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><path d="M4 4l16 16"></path></svg><span style="flex: 1">Hide me from the leaderboard</span><input type="checkbox" style="width: 22px; height: 22px; accent-color: #FFD60A"></label>
    <a href="08-permissions.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid #3B2758; color: #F4F2FA; text-decoration: none; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFD60A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg><span style="flex: 1">Alerts and camera</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8599" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    <a href="02-cookies.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid #3B2758; color: #F4F2FA; text-decoration: none; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF9F43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="9" cy="10" r="1"></circle><circle cx="14" cy="15" r="1"></circle><circle cx="15" cy="9" r="1"></circle></svg><span style="flex: 1">Cookies and privacy</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8599" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    <a href="06-add-to-home-screen.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid #3B2758; color: #F4F2FA; text-decoration: none; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFD60A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg><span style="flex: 1">Install the app</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8599" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid #3B2758; color: #F4F2FA; text-decoration: none; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BDB8CF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4M12 17v.5"></path></svg><span style="flex: 1">Help, fest rules, contact</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8599" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
  </nav>

  <div style="margin: 18px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <button style="height: 52px; border-radius: 16px; border: 1.5px solid #4A3466; background: transparent; color: #F4F2FA; font: inherit; font-size: 15px; font-weight: 700">Sign out</button>
    <a href="#" style="text-align: center; font-size: 13px; font-weight: 600; color: #FF8BE4">Delete my account and data</a>
    <span style="text-align: center; font-size: 12px; color: #8A8599">Member since 18 Nov · your votes stay private</span>
  </div>
</div>
</body>
</html>
