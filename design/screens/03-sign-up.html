<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#12091E}
a{color:#FFD60A}a:hover{color:#FFE680}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.m-bob{animation:bob 2.6s ease-in-out infinite}
.m-blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #12091E; font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden">

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 0">
    <a href="01-welcome.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid #3B2758; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F2FA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <svg class="m-bob" width="56" height="56" viewBox="0 0 72 72" aria-hidden="true"><path d="M13 48c0-15 10-24 23-24s23 9 23 24c0 9-7 12-23 12S13 57 13 48z" fill="#FFD60A"></path><g class="m-blink"><ellipse cx="29" cy="41" rx="4" ry="5" fill="#12091E"></ellipse><ellipse cx="43" cy="41" rx="4" ry="5" fill="#12091E"></ellipse></g><path d="M30 50c3 4 9 4 12 0z" fill="#12091E"></path></svg>
  </header>
  <h1 style="margin: 6px 20px 0; font-family: 'Bungee', 'Bricolage Grotesque', sans-serif; font-weight: 400; font-size: 40px; line-height: 0.95; font-weight: 800; letter-spacing: -0.03em">Join the<br><span style="color: #FFD60A">Fiesta crew</span></h1>
  <p style="margin: 10px 20px 0; font-size: 14px; line-height: 20px; color: #BDB8CF">Takes 20 seconds. You need an account only to vote and play the Stamp Hunt.</p>

  <form style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <a href="10-home.html" style="height: 52px; border-radius: 16px; background: #F4F2FA; color: #12091E; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 800"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285F4"></path><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"></path><path d="M6.4 14a6 6 0 0 1 0-4V7.4H3.1a10 10 0 0 0 0 9.2z" fill="#FBBC05"></path><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z" fill="#EA4335"></path></svg>Continue with Google</a>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: #8A8599"><span style="flex: 1; height: 1px; background: #3B2758"></span>OR WITH EMAIL<span style="flex: 1; height: 1px; background: #3B2758"></span></div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="name" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">FULL NAME</label>
      <input id="name" value="Asha Kumar" autocomplete="name" style="height: 48px; font: inherit; font-size: 15px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 14px; background: #1F1230; color: #F4F2FA">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">EMAIL</label>
      <input id="email" type="email" value="asha.k@gmail.com" autocomplete="email" style="height: 48px; font: inherit; font-size: 15px; border: 1.5px solid #FFD60A; border-radius: 14px; padding: 0 14px; background: #1F1230; color: #F4F2FA">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #FFD60A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>We'll email you a link to confirm</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pw" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">PASSWORD</label>
      <div style="display: flex; align-items: center; border: 1.5px solid #4A3466; border-radius: 14px; background: #1F1230; padding-right: 4px">
        <input id="pw" type="password" value="festlive2026!" autocomplete="new-password" style="flex: 1; height: 46px; font: inherit; font-size: 15px; border: 0; outline: none; padding: 0 14px; background: transparent; color: #F4F2FA">
        <button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BDB8CF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px" aria-hidden="true"><span style="height: 5px; border-radius: 3px; background: #FFD60A"></span><span style="height: 5px; border-radius: 3px; background: #FFD60A"></span><span style="height: 5px; border-radius: 3px; background: #FFD60A"></span><span style="height: 5px; border-radius: 3px; background: #3B2758"></span></div>
      <span style="font-size: 12px; color: #BDB8CF">Strong · at least 8 characters with a number</span>
    </div>

    <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 19px; color: #CFCBDD"><input type="checkbox" checked style="width: 20px; height: 20px; margin-top: 1px; accent-color: #FFD60A; flex: none">I agree to the <a href="#">fest rules</a> and <a href="#">privacy policy</a>.</label>
  </form>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 26px; display: flex; flex-direction: column; gap: 10px">
    <a href="04-check-email.html" style="height: 56px; border-radius: 18px; background: #FFD60A; color: #12091E; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; box-shadow: 5px 5px 0 #FF4FD8">Create account</a>
    <span style="font-size: 13px; color: #BDB8CF; text-align: center">Already have one? <a href="07-log-in.html" style="font-weight: 700">Log in</a></span>
    <span style="font-size: 12px; color: #8A8599; text-align: center">We'll email a confirmation link. Nothing else.</span>
  </div>
</div>
</body>
</html>
