<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>You&#x27;re verified · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#12091E}
a{color:#FFD60A}a:hover{color:#FFE680}
@keyframes pop{0%{transform:scale(.4) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes fall{0%{transform:translateY(-60px) rotate(0)}100%{transform:translateY(520px) rotate(540deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-20px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.pop{animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
.confetti{animation:fall 3.4s linear infinite}
.jump{animation:jump 1.2s ease-in-out infinite}
.m-blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #12091E; font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 90px 24px 0; text-align: center">

  </div>

  <div style="position: relative; width: 200px; height: 200px; display: flex; align-items: center; justify-content: center">

  </div>

  <h1 style="margin: 24px 0 0; font-family: 'Bungee', 'Bricolage Grotesque', sans-serif; font-weight: 400; font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">You're verified!</h1>
  <p style="margin: 14px 0 0; font-size: 16px; line-height: 24px; color: #CFCBDD">Welcome, Asha. Your college email is confirmed.</p>

  <ul style="list-style: none; margin: 26px 0 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left">
    <li style="display: flex; align-items: center; gap: 12px; background: #1F1230; border: 1.5px solid #3B2758; border-radius: 16px; padding: 12px 14px; font-size: 15px; font-weight: 600"><span style="width: 30px; height: 30px; border-radius: 10px; background: #FFD60A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12091E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Vote in college-only competitions</li>
    <li style="display: flex; align-items: center; gap: 12px; background: #1F1230; border: 1.5px solid #3B2758; border-radius: 16px; padding: 12px 14px; font-size: 15px; font-weight: 600"><span style="width: 30px; height: 30px; border-radius: 10px; background: #FFD60A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12091E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Win Stamp Hunt prizes</li>

  </ul>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 30px; display: flex; flex-direction: column; gap: 10px">
    <a href="06-add-to-home-screen.html" style="height: 56px; border-radius: 18px; background: #FFD60A; color: #12091E; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; box-shadow: 5px 5px 0 #FF4FD8">Add to Home Screen</a>
    <a href="08-permissions.html" style="height: 44px; display: flex; align-items: center; justify-content: center; color: #FFD60A; font-size: 14px; font-weight: 700; text-decoration: none">Get alerts for delays and changes</a>
    <a href="10-home.html" style="height: 50px; border-radius: 16px; border: 2px solid #3B2758; color: #F4F2FA; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">Go to the fest</a>
  </div>
</div>
</body>
</html>
