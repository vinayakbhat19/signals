<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password: code + new password · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#FFD60A}a:hover{color:#FFE680}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes dots{0%,100%{opacity:.2}50%{opacity:1}}
.float{animation:float 2.6s ease-in-out infinite}
.m-blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.dot{animation:dots 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #000000; font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden">
  <header style="padding: 12px 14px 0; display: flex; align-items: center; gap: 10px">
    <a href="07-log-in.html" aria-label="Back to log in" style="width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid #3B2758; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F2FA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bungee', 'Bricolage Grotesque', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.05">New password</h1>
  </header>
  <p style="margin: 14px 20px 0; font-size: 15px; line-height: 22px; color: #CFCBDD">We emailed a 6-digit code to <strong style="color: #F4F2FA">asha.k@gmail.com</strong>. Type it, then choose a new password.</p>
  <form style="padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">6-DIGIT CODE</span><div role="group" aria-label="6-digit code" style="display: flex; gap: 8px"><span style="width: 44px; height: 54px; border-radius: 14px; background: #1F1230; border: 2px solid #3B2758; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">4</span><span style="width: 44px; height: 54px; border-radius: 14px; background: #1F1230; border: 2px solid #3B2758; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">8</span><span style="width: 44px; height: 54px; border-radius: 14px; background: #1F1230; border: 2px solid #3B2758; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">1</span><span style="width: 44px; height: 54px; border-radius: 14px; background: #1F1230; border: 2px solid #3B2758; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">7</span><span style="width: 44px; height: 54px; border-radius: 14px; background: #1F1230; border: 2px solid #3B2758; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">0</span><span style="width: 44px; height: 54px; border-radius: 14px; background: #1F1230; border: 2px solid #FFD60A; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 800">2</span></div></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="np" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">NEW PASSWORD</label><input id="np" type="password" value="Fiesta2026" style="height: 50px; font: inherit; font-size: 16px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 14px; background: #000000; color: #F4F2FA; width: 100%; box-sizing: border-box"><span style="font-size: 12px; color: #9C97B0">At least 8 characters with a letter and a number</span></div>
    <button style="height: 56px; border-radius: 18px; border: 0; background: #FFD60A; color: #000000; font: inherit; font-size: 17px; font-weight: 800; box-shadow: 4px 4px 0 #FF4FD8">Save and log in</button>
    <button type="button" style="height: 48px; border-radius: 14px; border: 1.5px solid #3B2758; background: transparent; color: #9C97B0; font: inherit; font-size: 14px; font-weight: 700" disabled>Send a new code in 0:42</button>
  </form>
  <p style="margin: 14px 20px 0; font-size: 12px; line-height: 18px; color: #9C97B0">Step 1 was typing your email on the Log in screen and tapping "Forgot password?". The code works for a few minutes.</p>
</div>
</body>
</html>
