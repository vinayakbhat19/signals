<style>
body{margin:0;background:#000000}
a{color:#FFD60A}a:hover{color:#FFE680}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.m-bob{animation:bob 2.6s ease-in-out infinite}
.m-blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>

<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: radial-gradient(circle at 50% 44%, rgba(120,60,190,0.55), transparent 62%), radial-gradient(rgba(255,79,216,0.30) 1.4px, transparent 1.7px) 0 0 / 9px 9px, linear-gradient(180deg, #3B1E57, #2A1440 70%, #1F0F33); font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden">
  <img src="assets/fiesta-logo.png" alt="Fiesta 2026, intra college cultural fest" style="position: absolute; left: 50%; top: 44%; width: 320px; height: auto; transform: translate(-50%, -50%); filter: drop-shadow(0 10px 0 rgba(0,0,0,0.25))">
  <div style="position: absolute; left: 0; right: 0; top: 62%; display: flex; flex-direction: column; align-items: center; gap: 8px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.3em; color: #E7D8FF">BY</span>
    <img src="assets/signals-logo-horizontal.svg" alt="Signals" style="width: 190px; height: auto">
  </div>
  <span style="position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 11px; color: #BDB8CF">Final frame. The animation: the Fiesta logo lands while the Signals letters are still arranging, the letters circle over it, then arrange under it; black turns purple (design/prototype/fiesta-intro.html)</span>
