<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR poster (A4) · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A12}
a{color:#C6FF3D}a:hover{color:#E3FF9A}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 794px; height: 1123px; box-sizing: border-box; background: #0B0A12; color: #F4F2FA; font-family: Inter, system-ui, sans-serif; padding: 64px 64px 56px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden">

  <svg width="220" height="220" viewBox="0 0 120 120" aria-hidden="true" style="position: absolute; right: -40px; top: -30px"><path d="M60 6l9 33 33-9-24 24 24 24-33-9-9 33-9-33-33 9 24-24-24-24 33 9z" fill="#FF4FA3"></path></svg>

  <div style="display: flex; flex-direction: column; gap: 20px; position: relative">
    <span style="align-self: flex-start; font-size: 18px; font-weight: 800; letter-spacing: 0.14em; color: #0B0A12; background: #C6FF3D; padding: 8px 14px; border-radius: 10px; transform: rotate(-2deg)">[FEST NAME] · WED 25 NOV</span>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 112px; line-height: 0.88; font-weight: 800; letter-spacing: -0.04em">What's<br>on <span style="color: #C6FF3D">right</span><br>now?</h1>
    <p style="margin: 0; font-size: 26px; line-height: 36px; color: #CFCBDD; max-width: 560px">Live schedule, delays, scores, and people to team up with. Scan it.</p>
  </div>

  <div style="display: flex; align-items: center; gap: 36px; position: relative">
    <div style="width: 300px; height: 300px; background: #F4F2FA; border-radius: 32px; padding: 26px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; box-shadow: 10px 10px 0 #FF4FA3; transform: rotate(-2deg)" role="img" aria-label="QR code placeholder">
      <div style="width: 230px; height: 230px; position: relative; border: 2px dashed #8A8599; border-radius: 10px; box-sizing: border-box">
        <div style="position: absolute; left: 10px; top: 10px; width: 52px; height: 52px; border: 11px solid #0B0A12; box-sizing: border-box"></div>
        <div style="position: absolute; right: 10px; top: 10px; width: 52px; height: 52px; border: 11px solid #0B0A12; box-sizing: border-box"></div>
        <div style="position: absolute; left: 10px; bottom: 10px; width: 52px; height: 52px; border: 11px solid #0B0A12; box-sizing: border-box"></div>
        <span style="position: absolute; left: 0; right: 0; top: 102px; text-align: center; font-size: 14px; font-weight: 700; color: #4B4955">QR from /admin/qr</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px" aria-hidden="true">
      <svg width="190" height="190" viewBox="0 0 72 72"><path d="M56 42c6-3 9-9 8-15" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" fill="none"></path><path d="M36 17V9" stroke="#A78BFA" stroke-width="4" stroke-linecap="round"></path><circle cx="36" cy="8" r="4.5" fill="#C6FF3D"></circle><path d="M13 47c0-17 10-30 23-30s23 13 23 30c0 9-7 13-23 13S13 56 13 47z" fill="#A78BFA"></path><ellipse cx="29" cy="40" rx="4.2" ry="5.2" fill="#0B0A12"></ellipse><ellipse cx="43" cy="40" rx="4.2" ry="5.2" fill="#0B0A12"></ellipse><circle cx="30.4" cy="38.2" r="1.4" fill="#FFFFFF"></circle><circle cx="44.4" cy="38.2" r="1.4" fill="#FFFFFF"></circle><path d="M31 49c3 3.5 7 3.5 10 0" stroke="#0B0A12" stroke-width="2.6" fill="none" stroke-linecap="round"></path><circle cx="22" cy="47" r="3.2" fill="#FF4FA3" opacity="0.6"></circle><circle cx="50" cy="47" r="3.2" fill="#FF4FA3" opacity="0.6"></circle></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; line-height: 1.05; max-width: 250px">No app.<br>Just point your camera.</span>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-end; border-top: 2px solid #2E2A3D; padding-top: 22px; position: relative">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 36px; font-weight: 800; letter-spacing: -0.03em">fest<span style="color: #C6FF3D">.</span>live</span>
      <span style="font-size: 18px; color: #BDB8CF">[your-app].vercel.app</span>
    </div>
    <span style="font-size: 17px; color: #BDB8CF; text-align: right; line-height: 26px">Help desk: Main Gate<br>[College Name]</span>
  </div>
</div>
</body>
</html>
