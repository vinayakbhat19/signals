<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#FFD60A}a:hover{color:#FFE680}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-30deg)}}
.m-bob{animation:bob 2.6s ease-in-out infinite}
.m-blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.m-wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #000000; font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden">

  <header style="padding: 12px 14px 0">
    <a href="01-welcome.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid #3B2758; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F2FA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
  </header>

  <div style="display: flex; justify-content: center; margin-top: 10px">
    <svg class="m-bob" width="130" height="130" viewBox="0 0 72 72" aria-hidden="true"><path class="m-wave" d="M56 42c6-3 9-9 8-15" stroke="#9B6CFF" stroke-width="6" stroke-linecap="round" fill="none"></path><path d="M36 17V9" stroke="#9B6CFF" stroke-width="4" stroke-linecap="round"></path><circle cx="36" cy="8" r="4.5" fill="#FFD60A"></circle><path d="M13 47c0-17 10-30 23-30s23 13 23 30c0 9-7 13-23 13S13 56 13 47z" fill="#9B6CFF"></path><g class="m-blink"><ellipse cx="29" cy="40" rx="4.2" ry="5.2" fill="#000000"></ellipse><ellipse cx="43" cy="40" rx="4.2" ry="5.2" fill="#000000"></ellipse></g><path d="M31 49c3 3.5 7 3.5 10 0" stroke="#000000" stroke-width="2.6" fill="none" stroke-linecap="round"></path><circle cx="22" cy="47" r="3.2" fill="#FF4FD8" opacity="0.6"></circle><circle cx="50" cy="47" r="3.2" fill="#FF4FD8" opacity="0.6"></circle></svg>
  </div>
  <h1 style="margin: 8px 20px 0; font-family: 'Bungee', 'Bricolage Grotesque', sans-serif; font-weight: 400; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; text-align: center; line-height: 1">Welcome back</h1>
  <p style="margin: 8px 20px 0; font-size: 14px; color: #BDB8CF; text-align: center">Log in to vote and keep your stamps.</p>

  <form style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <a href="10-home.html" style="height: 52px; border-radius: 16px; background: #F4F2FA; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 800"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.2 5.6c4.3-4 7.1-9.9 7.1-17z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2 1.4-4.6 2.2-8.7 2.2-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</a>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: #8A8599"><span style="flex: 1; height: 1px; background: #3B2758"></span>OR WITH EMAIL<span style="flex: 1; height: 1px; background: #3B2758"></span></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="lemail" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">EMAIL</label>
      <input id="lemail" type="email" value="asha.k@gmail.com" autocomplete="email" style="height: 48px; font: inherit; font-size: 15px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 14px; background: #1F1230; color: #F4F2FA">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><label for="lpw" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">PASSWORD</label><a href="09-reset-password.html" style="font-size: 13px; font-weight: 700; padding: 6px 0">Forgot password?</a></div>
      <input id="lpw" type="password" value="festlive" autocomplete="current-password" style="height: 48px; font: inherit; font-size: 15px; border: 1.5px solid #FF4FD8; border-radius: 14px; padding: 0 14px; background: #1F1230; color: #F4F2FA">
      <span role="alert" style="font-size: 13px; font-weight: 600; color: #FF8BE4">That password doesn't match. Try again or reset it.</span>
    </div>
    <label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 44px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #FFD60A">Keep me signed in on this phone</label>
  </form>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 26px; display: flex; flex-direction: column; gap: 10px">
    <a href="10-home.html" style="height: 56px; border-radius: 18px; background: #FFD60A; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; box-shadow: 5px 5px 0 #FF4FD8">Log in</a>
    <span style="font-size: 13px; color: #BDB8CF; text-align: center">New here? <a href="03-sign-up.html" style="font-weight: 700">Create an account</a></span>
  </div>
</div>
</body>
</html>
