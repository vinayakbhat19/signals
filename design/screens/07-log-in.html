<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A12}
a{color:#C6FF3D}a:hover{color:#E3FF9A}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-30deg)}}
.m-bob{animation:bob 2.6s ease-in-out infinite}
.m-blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.m-wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #0B0A12; font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden">

  <header style="padding: 12px 14px 0">
    <a href="01-welcome.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid #2E2A3D; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F2FA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
  </header>

  <div style="display: flex; justify-content: center; margin-top: 10px">
    <svg class="m-bob" width="130" height="130" viewBox="0 0 72 72" aria-hidden="true"><path class="m-wave" d="M56 42c6-3 9-9 8-15" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" fill="none"></path><path d="M36 17V9" stroke="#A78BFA" stroke-width="4" stroke-linecap="round"></path><circle cx="36" cy="8" r="4.5" fill="#C6FF3D"></circle><path d="M13 47c0-17 10-30 23-30s23 13 23 30c0 9-7 13-23 13S13 56 13 47z" fill="#A78BFA"></path><g class="m-blink"><ellipse cx="29" cy="40" rx="4.2" ry="5.2" fill="#0B0A12"></ellipse><ellipse cx="43" cy="40" rx="4.2" ry="5.2" fill="#0B0A12"></ellipse></g><path d="M31 49c3 3.5 7 3.5 10 0" stroke="#0B0A12" stroke-width="2.6" fill="none" stroke-linecap="round"></path><circle cx="22" cy="47" r="3.2" fill="#FF4FA3" opacity="0.6"></circle><circle cx="50" cy="47" r="3.2" fill="#FF4FA3" opacity="0.6"></circle></svg>
  </div>
  <h1 style="margin: 8px 20px 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; text-align: center; line-height: 1">Welcome back</h1>
  <p style="margin: 8px 20px 0; font-size: 14px; color: #BDB8CF; text-align: center">Log in to vote and keep your stamps.</p>

  <form style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <a href="10-home.html" style="height: 52px; border-radius: 16px; background: #F4F2FA; color: #0B0A12; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; font-weight: 800"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285F4"></path><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z" fill="#34A853"></path><path d="M6.4 14a6 6 0 0 1 0-4V7.4H3.1a10 10 0 0 0 0 9.2z" fill="#FBBC05"></path><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z" fill="#EA4335"></path></svg>Continue with Google</a>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: #8A8599"><span style="flex: 1; height: 1px; background: #2E2A3D"></span>OR<span style="flex: 1; height: 1px; background: #2E2A3D"></span></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="lemail" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">EMAIL</label>
      <input id="lemail" type="email" value="asha.k@[college].ac.in" autocomplete="email" style="height: 48px; font: inherit; font-size: 15px; border: 1.5px solid #3A3549; border-radius: 14px; padding: 0 14px; background: #16141F; color: #F4F2FA">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><label for="lpw" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">PASSWORD</label><a href="#" style="font-size: 13px; font-weight: 700; padding: 6px 0">Forgot password?</a></div>
      <input id="lpw" type="password" value="festlive" autocomplete="current-password" style="height: 48px; font: inherit; font-size: 15px; border: 1.5px solid #FF4FA3; border-radius: 14px; padding: 0 14px; background: #16141F; color: #F4F2FA">
      <span role="alert" style="font-size: 13px; font-weight: 600; color: #FF7DBB">That password doesn't match. Try again or reset it.</span>
    </div>
    <label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 44px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #C6FF3D">Keep me signed in on this phone</label>
  </form>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 26px; display: flex; flex-direction: column; gap: 10px">
    <a href="10-home.html" style="height: 56px; border-radius: 18px; background: #C6FF3D; color: #0B0A12; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; box-shadow: 5px 5px 0 #FF4FA3">Log in</a>
    <span style="font-size: 13px; color: #BDB8CF; text-align: center">New here? <a href="03-sign-up.html" style="font-weight: 700">Create an account</a></span>
  </div>
</div>
</body>
</html>
