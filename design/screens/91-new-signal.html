<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raise a Signal · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A12}
a{color:#FFD60A}a:hover{color:#FFE680}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes ping{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.m-bob{animation:bob 2.4s ease-in-out infinite}
.m-blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #0B0A12; font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 0">
    <a href="90-signals.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 14px; background: #1F1230; border: 1.5px solid #3B2758; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F2FA" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <svg width="64" height="64" viewBox="0 0 80 80" aria-hidden="true"><circle class="ping" cx="40" cy="22" r="14" fill="none" stroke="#FFD60A" stroke-width="2"></circle><g class="m-bob"><path d="M40 26V16" stroke="#9B6CFF" stroke-width="4" stroke-linecap="round"></path><circle cx="40" cy="14" r="5" fill="#FFD60A"></circle><path d="M17 53c0-17 10-27 23-27s23 10 23 27c0 9-7 12-23 12S17 62 17 53z" fill="#9B6CFF"></path><g class="m-blink"><ellipse cx="33" cy="46" rx="4" ry="5" fill="#0B0A12"></ellipse><ellipse cx="47" cy="46" rx="4" ry="5" fill="#0B0A12"></ellipse></g><ellipse cx="40" cy="56" rx="4" ry="3.2" fill="#0B0A12"></ellipse></g></svg>
  </header>
  <h1 style="margin: 4px 20px 0; font-family: 'Bungee', 'Bricolage Grotesque', sans-serif; font-weight: 400; font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">Send out a<br><span style="color: #FFD60A">Signal</span></h1>

  <form style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 18px">
    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0; padding: 0 0 10px">I'M LOOKING TO…</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <label style="border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; background: #22D3EE; color: #0B0A12; box-shadow: 4px 4px 0 #FF4FD8">
          <input type="radio" name="type" checked style="position: absolute; opacity: 0; width: 1px; height: 1px">
          <span style="font-size: 15px; font-weight: 800">Find a teammate</span>
          <span style="font-size: 12px; font-weight: 600">for an event</span>
        </label>
        <label style="border: 1.5px solid #3B2758; background: #1F1230; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px; cursor: pointer">
          <input type="radio" name="type" style="position: absolute; opacity: 0; width: 1px; height: 1px">
          <span style="font-size: 15px; font-weight: 700">Build something</span>
          <span style="font-size: 12px; color: #9C97B0">a project idea</span>
        </label>
        <label style="border: 1.5px solid #3B2758; background: #1F1230; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px; cursor: pointer">
          <input type="radio" name="type" style="position: absolute; opacity: 0; width: 1px; height: 1px">
          <span style="font-size: 15px; font-weight: 700">Meet new people</span>
          <span style="font-size: 12px; color: #9C97B0">open to connect</span>
        </label>
        <label style="border: 1.5px solid #3B2758; background: #1F1230; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px; cursor: pointer">
          <input type="radio" name="type" style="position: absolute; opacity: 0; width: 1px; height: 1px">
          <span style="font-size: 15px; font-weight: 700">Get work</span>
          <span style="font-size: 12px; color: #9C97B0">internship or gig</span>
        </label>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="body" style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">SAY IT IN A LINE</label>
      <textarea id="body" rows="3" style="font: inherit; font-size: 16px; line-height: 23px; border: 1.5px solid #4A3466; border-radius: 18px; padding: 12px 14px; background: #1F1230; resize: none; color: #F4F2FA">Hackathon team needs 1 ML person. Idea and frontend ready!</textarea>
      <span style="font-size: 12px; color: #9C97B0; align-self: flex-end">59 / 200</span>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0; padding: 0 0 10px">TAGS · PICK UP TO 3</legend>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button type="button" aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: #FFD60A; color: #0B0A12; font: inherit; font-size: 13px; font-weight: 800">#AI</button>
        <button type="button" aria-pressed="true" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: #FF4FD8; color: #0B0A12; font: inherit; font-size: 13px; font-weight: 800">#Data</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #4A3466; background: transparent; color: #F4F2FA; font: inherit; font-size: 13px; font-weight: 600">#Web</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #4A3466; background: transparent; color: #F4F2FA; font: inherit; font-size: 13px; font-weight: 600">#App</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #4A3466; background: transparent; color: #F4F2FA; font: inherit; font-size: 13px; font-weight: 600">#Design</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #4A3466; background: transparent; color: #F4F2FA; font: inherit; font-size: 13px; font-weight: 600">#Robotics</button>
        <button type="button" aria-pressed="false" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid #4A3466; background: transparent; color: #F4F2FA; font: inherit; font-size: 13px; font-weight: 600">#Music</button>
      </div>
    </fieldset>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="event" style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">EVENT</label>
        <select id="event" style="height: 48px; font: inherit; font-size: 14px; border: 1.5px solid #4A3466; border-radius: 16px; padding: 0 10px; background: #1F1230; color: #F4F2FA"><option>24-hour Hackathon</option><option>None</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="expiry" style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">LIVE FOR</label>
        <select id="expiry" style="height: 48px; font: inherit; font-size: 14px; border: 1.5px solid #4A3466; border-radius: 16px; padding: 0 10px; background: #1F1230; color: #F4F2FA"><option>6 hours</option><option>24 hours</option><option>3 days</option><option>7 days</option></select>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="contact" style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">HOW TO REACH YOU</label>
      <input id="contact" value="instagram.com/asha.builds" style="height: 48px; font: inherit; font-size: 15px; border: 1.5px solid #4A3466; border-radius: 16px; padding: 0 14px; background: #1F1230; color: #F4F2FA">
      <span style="display: flex; gap: 8px; align-items: center; font-size: 13px; color: #FFD60A; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Only people you accept see this</span>
    </div>
  </form>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 58px; border-radius: 18px; border: 0; background: #FFD60A; color: #0B0A12; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 5px 5px 0 #FF4FD8">Send it out</button>
    <span style="font-size: 12px; color: #9C97B0; text-align: center">1 of 3 Signals used</span>
  </div>
</div>
</body>
</html>
