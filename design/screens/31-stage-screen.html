<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage screen (16:9) · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A12}
a{color:#FFD60A}a:hover{color:#FFE680}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes countdown{from{stroke-dashoffset:0}to{stroke-dashoffset:302}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,79,216,.75)}100%{box-shadow:0 0 0 14px rgba(255,79,216,0)}}
@keyframes crown{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-5px) rotate(8deg)}}
.bar{transform-origin:left center;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}
.m-bob{animation:bob 1.2s ease-in-out infinite}
.m-blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.m-wiggle{transform-origin:50% 90%;animation:wiggle .8s ease-in-out infinite}
.ring{animation:countdown 30s linear infinite}
.live-dot{animation:pulse 1.4s ease-out infinite}
.crown{animation:crown 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #0B0A12; color: #F4F2FA; font-family: Inter, system-ui, sans-serif; padding: 44px 56px; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 48px; position: relative; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 26px; min-width: 0">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; color: #FF8BE4"><span class="live-dot" style="width: 16px; height: 16px; border-radius: 8px; background: #FF4FD8"></span>LIVE AUDIENCE VOTE</span>
      <h1 style="margin: 0; font-family: 'Bungee', 'Bricolage Grotesque', sans-serif; font-weight: 400; font-size: 60px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.95">Battle of Bands</h1>
    </div>

    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px">
      <li style="display: grid; grid-template-columns: 250px minmax(0, 1fr) 110px; align-items: center; gap: 18px">
        <span style="display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 800"><svg class="crown" width="36" height="28" viewBox="0 0 26 20" aria-label="Leading" role="img"><path d="M2 18l2-12 6 6 3-10 3 10 6-6 2 12z" fill="#FFE14D" stroke="#0B0A12" stroke-width="1.5" stroke-linejoin="round"></path></svg>The Raagas</span>
        <div style="height: 40px; border-radius: 14px; background: #2A1A3F; overflow: hidden"><div class="bar" style="width: 46%; height: 40px; border-radius: 14px; background: #FFD60A; box-shadow: 0 0 30px rgba(255,214,10,0.35)"></div></div>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; color: #FFD60A; text-align: right">46%</span>
      </li>
      <li style="display: grid; grid-template-columns: 250px minmax(0, 1fr) 110px; align-items: center; gap: 18px">
        <span style="font-size: 28px; font-weight: 700; padding-left: 48px">Night Shift</span>
        <div style="height: 40px; border-radius: 14px; background: #2A1A3F; overflow: hidden"><div class="bar" style="width: 31%; height: 40px; border-radius: 14px; background: #9B6CFF; animation-delay: .15s"></div></div>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; text-align: right">31%</span>
      </li>
      <li style="display: grid; grid-template-columns: 250px minmax(0, 1fr) 110px; align-items: center; gap: 18px">
        <span style="font-size: 28px; font-weight: 700; padding-left: 48px">Static Noise</span>
        <div style="height: 40px; border-radius: 14px; background: #2A1A3F; overflow: hidden"><div class="bar" style="width: 15%; height: 40px; border-radius: 14px; background: #FF9F43; animation-delay: .3s"></div></div>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; text-align: right">15%</span>
      </li>
      <li style="display: grid; grid-template-columns: 250px minmax(0, 1fr) 110px; align-items: center; gap: 18px">
        <span style="font-size: 28px; font-weight: 700; padding-left: 48px">Echo</span>
        <div style="height: 40px; border-radius: 14px; background: #2A1A3F; overflow: hidden"><div class="bar" style="width: 8%; height: 40px; border-radius: 14px; background: #FFE14D; animation-delay: .45s"></div></div>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; text-align: right">8%</span>
      </li>
    </ol>

    <div style="display: flex; align-items: flex-end; gap: 22px; margin-top: auto" aria-hidden="true">
      <svg class="m-wiggle" width="90" height="90" viewBox="0 0 72 72"><path d="M15 34a21 21 0 0 1 42 0" stroke="#F4F2FA" stroke-width="4" fill="none"></path><rect x="10" y="32" width="9" height="14" rx="4" fill="#F4F2FA"></rect><rect x="53" y="32" width="9" height="14" rx="4" fill="#F4F2FA"></rect><path d="M14 48c0-16 9-28 22-28s22 12 22 28c0 9-7 12-22 12S14 57 14 48z" fill="#FF4FD8"></path><g class="m-blink"><path d="M25 42q4-5 8 0M39 42q4-5 8 0" stroke="#0B0A12" stroke-width="3" fill="none" stroke-linecap="round"></path></g><ellipse cx="36" cy="51" rx="4" ry="3" fill="#0B0A12"></ellipse></svg>
      <svg class="m-bob" width="80" height="80" viewBox="0 0 72 72" style="animation-delay: .3s"><path d="M18 26l5-6 5 6 5-6 5 6 5-6 5 6 5-6" stroke="#22D3EE" stroke-width="3" fill="none" stroke-linejoin="round"></path><path d="M13 48c0-15 10-24 23-24s23 9 23 24c0 9-7 12-23 12S13 57 13 48z" fill="#22D3EE"></path><g class="m-blink"><rect x="24" y="38" width="8" height="8" rx="2" fill="#0B0A12"></rect><rect x="40" y="38" width="8" height="8" rx="2" fill="#0B0A12"></rect></g><path d="M29 49c3 5 11 5 14 0z" fill="#0B0A12"></path></svg>
      <svg class="m-bob" width="96" height="96" viewBox="0 0 72 72" style="animation-delay: .6s"><path d="M36 17V9" stroke="#9B6CFF" stroke-width="4" stroke-linecap="round"></path><circle cx="36" cy="8" r="4.5" fill="#FFD60A"></circle><path d="M13 47c0-17 10-30 23-30s23 13 23 30c0 9-7 13-23 13S13 56 13 47z" fill="#9B6CFF"></path><g class="m-blink"><ellipse cx="29" cy="40" rx="4.2" ry="5.2" fill="#0B0A12"></ellipse><ellipse cx="43" cy="40" rx="4.2" ry="5.2" fill="#0B0A12"></ellipse></g><path d="M30 49c3 4.5 9 4.5 12 0z" fill="#0B0A12"></path></svg>
      <span style="margin-left: auto; font-size: 22px; font-weight: 700; color: #BDB8CF"><strong style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; color: #F4F2FA">1,284</strong> votes · closes 7:45 PM</span>
    </div>
  </div>

  <aside style="display: flex; flex-direction: column; align-items: center; gap: 18px; background: #1F1230; border: 2px solid #3B2758; border-radius: 32px; padding: 26px 24px">
    <img src="assets/fiesta-logo.png" alt="Fiesta 2026" style="width: 170px; height: auto; display: block">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800">Open the app, tap Vote</span>
    <div style="width: 230px; height: 230px; background: #F4F2FA; border-radius: 24px; display: flex; align-items: center; justify-content: center" role="img" aria-label="QR code to the event page (placeholder)">
      <div style="width: 190px; height: 190px; position: relative; border: 2px dashed #8A8599; border-radius: 8px; box-sizing: border-box">
        <div style="position: absolute; left: 8px; top: 8px; width: 44px; height: 44px; border: 9px solid #0B0A12; box-sizing: border-box"></div>
        <div style="position: absolute; right: 8px; top: 8px; width: 44px; height: 44px; border: 9px solid #0B0A12; box-sizing: border-box"></div>
        <div style="position: absolute; left: 8px; bottom: 8px; width: 44px; height: 44px; border: 9px solid #0B0A12; box-sizing: border-box"></div>
      </div>
    </div>
    <span style="font-size: 18px; font-weight: 700; color: #BDB8CF; text-align: center">Scan to open this event, then tap <strong style="color: #FFD60A">Vote</strong></span>
    <span style="font-size: 15px; color: #9C97B0; text-align: center">Anyone signed in can vote · 1 vote per person · sample numbers</span>
  </aside>
</div>
</body>
</html>
