<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your email · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A12}
a{color:#FFD60A}a:hover{color:#FFE680}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes dots{0%,100%{opacity:.2}50%{opacity:1}}
.float{animation:float 2.6s ease-in-out infinite}
.m-blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.dot{animation:dots 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #0B0A12; font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 70px 24px 0; text-align: center">

  <svg class="float" width="190" height="170" viewBox="0 0 190 170" aria-hidden="true">
    <rect x="20" y="40" width="150" height="104" rx="16" fill="#F4F2FA"></rect>
    <path d="M20 56l75 50 75-50" stroke="#0B0A12" stroke-width="6" fill="none" stroke-linejoin="round"></path>
    <g transform="translate(112 6)"><path d="M13 47c0-17 10-30 23-30s23 13 23 30c0 9-7 13-23 13S13 56 13 47z" fill="#FFD60A"></path><g class="m-blink"><ellipse cx="29" cy="40" rx="4" ry="5" fill="#0B0A12"></ellipse><ellipse cx="43" cy="40" rx="4" ry="5" fill="#0B0A12"></ellipse></g><path d="M31 49c3 3.5 7 3.5 10 0" stroke="#0B0A12" stroke-width="2.6" fill="none" stroke-linecap="round"></path></g>
  </svg>

  <h1 style="margin: 26px 0 0; font-family: 'Bungee', 'Bricolage Grotesque', sans-serif; font-weight: 400; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">Check your email</h1>
  <p style="margin: 14px 0 0; font-size: 16px; line-height: 24px; color: #CFCBDD">We sent a confirmation link to<br><strong style="color: #F4F2FA">asha.k@gmail.com</strong></p>
  <p style="margin: 10px 0 0; font-size: 14px; line-height: 21px; color: #9C97B0">Tap the link on this phone to finish. Then you can vote and collect stamps.</p>

  <div style="margin-top: 26px; display: flex; align-items: center; gap: 10px; background: #1F1230; border: 1.5px solid #3B2758; border-radius: 16px; padding: 12px 16px; font-size: 14px; font-weight: 600">
    <span style="display: flex; gap: 4px" aria-hidden="true"><span class="dot" style="width: 8px; height: 8px; border-radius: 4px; background: #FFD60A"></span><span class="dot" style="width: 8px; height: 8px; border-radius: 4px; background: #FFD60A; animation-delay: .2s"></span><span class="dot" style="width: 8px; height: 8px; border-radius: 4px; background: #FFD60A; animation-delay: .4s"></span></span>
    Waiting for you to confirm…
  </div>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 30px; display: flex; flex-direction: column; gap: 10px">
    <a href="05-verified.html" style="height: 56px; border-radius: 18px; background: #FFD60A; color: #0B0A12; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; box-shadow: 5px 5px 0 #FF4FD8">Open my email app</a>
    <button disabled style="height: 50px; border-radius: 16px; border: 2px solid #3B2758; background: transparent; color: #9C97B0; font: inherit; font-size: 15px; font-weight: 700">Resend in 0:42</button>
    <span style="font-size: 13px; color: #BDB8CF">Wrong email? <a href="03-sign-up.html" style="font-weight: 700">Change it</a> · Check spam too</span>
  </div>
</div>
</body>
</html>
