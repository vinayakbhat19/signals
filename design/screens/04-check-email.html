<style>
body{margin:0;background:#000000}
a{color:#FFD60A}a:hover{color:#FFE680}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes dots{0%,100%{opacity:.2}50%{opacity:1}}
.float{animation:float 2.6s ease-in-out infinite}
.m-blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}

<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #000000; font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 70px 24px 0; text-align: center">

  <p style="margin: 14px 0 0; font-size: 16px; line-height: 24px; color: #CFCBDD">We emailed a 6-digit code to<br><strong style="color: #F4F2FA">asha.k@gmail.com</strong></p>

  <div role="group" aria-label="6-digit code" style="margin-top: 24px; display: flex; gap: 8px; justify-content: center">
    <span style="width: 46px; height: 58px; border-radius: 14px; background: #1F1230; border: 2px solid #3B2758; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800">4</span><span style="width: 46px; height: 58px; border-radius: 14px; background: #1F1230; border: 2px solid #3B2758; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800">8</span><span style="width: 46px; height: 58px; border-radius: 14px; background: #1F1230; border: 2px solid #3B2758; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800">1</span><span style="width: 46px; height: 58px; border-radius: 14px; background: #1F1230; border: 2px solid #3B2758; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800">7</span><span style="width: 46px; height: 58px; border-radius: 14px; background: #1F1230; border: 2px solid #FFD60A; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800">0</span><span style="width: 46px; height: 58px; border-radius: 14px; background: #1F1230; border: 2px solid #3B2758; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 800"></span>
  </div>
  <p style="margin: 12px 0 0; font-size: 13px; line-height: 19px; color: #9C97B0">The code works for a few minutes. Check spam too. It is a code, not a link: type it here.</p>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 30px; display: flex; flex-direction: column; gap: 10px">
    <a href="05-verified.html" style="height: 56px; border-radius: 18px; background: #FFD60A; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; box-shadow: 4px 4px 0 #FF4FD8">Verify and continue</a>
