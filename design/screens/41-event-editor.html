<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event editor + cover · Fest Live design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A12}
a{color:#FFD60A}a:hover{color:#FFE680}
</style>
<style>body{display:flex;justify-content:center;min-height:100vh}</style>
</head>
<body>
<div style="width: 390px; height: 1040px; position: relative; box-sizing: border-box; background: #0B0A12; font-family: Inter, system-ui, sans-serif; color: #F4F2FA; overflow: hidden">

  <header style="padding: 12px 14px 0; display: flex; align-items: center; gap: 10px">
    <a href="40-control-room.html" aria-label="Back to control room" style="width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid #3B2758; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F2FA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #FFE14D">ORGANISER</span><h1 style="margin: 0; font-family: 'Bungee', 'Bricolage Grotesque', sans-serif; font-weight: 400; font-size: 24px; font-weight: 800; line-height: 1">Edit event</h1></div>
    <span style="font-size: 12px; font-weight: 700; color: #9C97B0">Draft saved</span>
  </header>

  <form style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">COVER PHOTO · 16:9</span>
      <div style="position: relative; height: 196px; border-radius: 20px; overflow: hidden; border: 1.5px solid #3B2758">
        <svg width="358" height="196" viewBox="0 0 358 196" role="img" aria-label="Cover photo preview: Solo Singing" style="display: block; width: 100%; height: 100%"><rect width="358" height="196" fill="#9B6CFF"></rect><path d="M80 0L40 170h80z" fill="#FFE14D" opacity="0.45"></path><path d="M280 0L240 170h80z" fill="#FF4FD8" opacity="0.45"></path><circle cx="179" cy="78" r="20" fill="#0B0A12"></circle><rect x="174" y="96" width="10" height="26" rx="3" fill="#0B0A12"></rect><path d="M164 118c0 14 30 14 30 0" stroke="#0B0A12" stroke-width="4" fill="none"></path><rect y="158" width="358" height="38" fill="#0B0A12"></rect></svg>
        <div style="position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 8px">
          <label style="flex: 1; height: 42px; border-radius: 12px; background: #FFD60A; color: #0B0A12; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 800; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l4-4 3 3 5-5 4 4"></path><rect x="3" y="4" width="18" height="16" rx="2"></rect></svg>Change photo<input type="file" accept="image/*" style="position: absolute; width: 1px; height: 1px; opacity: 0"></label>
          <button type="button" style="height: 42px; padding: 0 12px; border-radius: 12px; border: 0; background: rgba(11,10,18,0.85); color: #F4F2FA; font: inherit; font-size: 13px; font-weight: 700">Crop</button>
          <button type="button" aria-label="Remove photo" style="width: 42px; height: 42px; border-radius: 12px; border: 0; background: rgba(11,10,18,0.85); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8BE4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
        </div>
      </div>
      <span style="font-size: 12px; color: #9C97B0">JPG or PNG up to 5 MB. Resized to 1600 px automatically.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px"><label for="t" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">TITLE</label><input id="t" value="Solo Singing" style="height: 46px; font: inherit; font-size: 15px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 14px; background: #1F1230; color: #F4F2FA"></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="d" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">DATE</label><input id="d" value="25 Nov" style="height: 46px; font: inherit; font-size: 14px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 10px; background: #1F1230; color: #F4F2FA; min-width: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="s" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">START</label><input id="s" value="8:00 PM" style="height: 46px; font: inherit; font-size: 14px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 10px; background: #1F1230; color: #F4F2FA; min-width: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="e" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">END</label><input id="e" value="10:00 PM" style="height: 46px; font: inherit; font-size: 14px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 10px; background: #1F1230; color: #F4F2FA; min-width: 0"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="v" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">VENUE</label><select id="v" style="height: 46px; font: inherit; font-size: 14px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 10px; background: #1F1230; color: #F4F2FA"><option>Open Air Theatre</option></select></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="c" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">CATEGORY</label><select id="c" style="height: 46px; font: inherit; font-size: 14px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 10px; background: #1F1230; color: #F4F2FA"><option>Cultural</option></select></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="h" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">HOSTED BY</label><input id="h" value="Music Club" style="height: 46px; font: inherit; font-size: 14px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 10px; background: #1F1230; color: #F4F2FA; min-width: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="hc" style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #9C97B0">COORDINATOR</label><input id="hc" value="Neha S · help desk" style="height: 46px; font: inherit; font-size: 14px; border: 1.5px solid #4A3466; border-radius: 14px; padding: 0 10px; background: #1F1230; color: #F4F2FA; min-width: 0"></div>
    </div>

    <div style="background: #1F1230; border: 1.5px solid #3B2758; border-radius: 18px; padding: 4px 14px">
      <label style="display: flex; justify-content: space-between; align-items: center; min-height: 46px; font-size: 14px; font-weight: 700">Audience voting<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #FFD60A"></label>
      <label style="display: flex; justify-content: space-between; align-items: center; min-height: 46px; font-size: 14px; font-weight: 700; border-top: 1px solid #3B2758">Stamp Station<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #FFD60A"></label>
      <label style="display: flex; justify-content: space-between; align-items: center; min-height: 46px; font-size: 14px; font-weight: 700; border-top: 1px solid #3B2758">Published (visible to students)<input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #FFD60A"></label>
    </div>
  </form>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
    <a href="12-event.html" style="height: 54px; border-radius: 16px; border: 1.5px solid #4A3466; color: #F4F2FA; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">Preview</a>
    <button style="height: 54px; border-radius: 16px; border: 0; background: #FFD60A; color: #0B0A12; font: inherit; font-size: 16px; font-weight: 800; box-shadow: 4px 4px 0 #FF4FD8">Save and publish</button>
  </div>
</div>
</body>
</html>
