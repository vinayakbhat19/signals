<!doctype html>
<html lang="en" class="play">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Fiesta'26 Live · intro</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#F4F2FA}
.scene{position:fixed;inset:0;overflow:hidden;background:#000}

/* Fiesta purple slowly takes over the black screen from the spot where the logo lands */
.bg{position:absolute;inset:0;background:
  radial-gradient(circle at 50% 40%,rgba(120,60,190,.55),transparent 62%),
  radial-gradient(rgba(255,79,216,.30) 1.4px,transparent 1.7px) 0 0/9px 9px,
  linear-gradient(180deg,#3B1E57,#2A1440 70%,#1F0F33)}
.play .bg{clip-path:circle(0% at 50% 40%);animation:reveal 2.3s cubic-bezier(.25,.6,.25,1) 1.2s forwards}
@keyframes reveal{to{clip-path:circle(150% at 50% 40%)}}

/* the Fiesta logo falls while the letters are still arranging, and smashes in at 1.2 s */
.fiesta{position:absolute;left:50%;top:40%;width:min(82vw,380px);height:auto;transform:translate(-50%,-50%);z-index:5;filter:drop-shadow(0 10px 0 rgba(0,0,0,.25))}
.play .fiesta{animation:drop .9s both;animation-delay:.57s}
@keyframes drop{
  0%{transform:translate(-50%,-85vh) scale(1.8) rotate(-9deg);animation-timing-function:cubic-bezier(.6,0,.95,.55)}
  70%{transform:translate(-50%,-50%) scale(1.04) rotate(1.5deg);animation-timing-function:ease-out}
  80%{transform:translate(-50%,-47%) scale(1.06,.88) rotate(0)}
  91%{transform:translate(-50%,-52%) scale(.97,1.05)}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0)}
}
.play .scene{animation:shake .45s 1.2s both}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-9px,5px)}30%{transform:translate(8px,-6px)}45%{transform:translate(-6px,-4px)}60%{transform:translate(5px,5px)}80%{transform:translate(-2px,2px)}}
.boom{position:absolute;left:50%;top:40%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:5px solid #FFD60A;opacity:0;z-index:4}
.boom.b2{border-color:#FF4FD8;border-width:3px}
.play .boom{animation:boom .8s ease-out 1.2s forwards}.play .boom.b2{animation-delay:1.3s}
@keyframes boom{0%{transform:scale(.2);opacity:.95}100%{transform:scale(5.5);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:6;pointer-events:none}
.play .flash{animation:flash .4s ease-out 1.2s forwards}
@keyframes flash{0%{opacity:.5}100%{opacity:0}}
.conf{position:absolute;left:50%;top:40%;z-index:7;pointer-events:none}
.conf i{position:absolute;display:block;background:var(--c);border-radius:2px;opacity:0}
.play .conf i{animation:conf 1.4s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 90px)) rotate(calc(var(--r) * 3))}}

/* the SIGNALS letters: they are placed on their final spot under the logo and animated from JavaScript */
.l{position:fixed;left:0;top:0;z-index:8;display:block;text-align:center;font-family:Bungee,sans-serif;line-height:1;user-select:none;will-change:transform}
.l:nth-child(1){color:#9B6CFF}.l:nth-child(2){color:#F4F2FA}.l:nth-child(3){color:#FFD60A}.l:nth-child(4){color:#FF4FD8}.l:nth-child(5){color:#22D3EE}.l:nth-child(6){color:#C6FF3D}.l:nth-child(7){color:#FF9F43}
.row{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:4;visibility:hidden}
.row .mk{height:1.25em;width:auto;flex:none;visibility:visible}
.row .slot{display:block;text-align:center;font-family:Bungee,sans-serif;line-height:1;visibility:hidden}
.by{position:absolute;left:0;right:0;text-align:center;z-index:5;font-size:12px;font-weight:700;letter-spacing:.3em;color:#E7D8FF}
.play .by{animation:rise .6s ease-out 2.9s both}
.play .row .mk{animation:mark .55s cubic-bezier(.3,1.7,.5,1) 3.15s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes mark{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}

.skip{position:absolute;right:14px;top:max(12px,env(safe-area-inset-top));z-index:9;height:36px;padding:0 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#F4F2FA;font:inherit;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px)}
.note{position:absolute;left:20px;right:20px;bottom:calc(56px + env(safe-area-inset-bottom));z-index:9;text-align:center;font-size:12px;line-height:18px;color:#E7D8FF;background:rgba(0,0,0,.35);border-radius:12px;padding:8px 10px}
.replay{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;z-index:9;font-size:12px;color:#BDB8CF;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.boom,.flash,.conf{display:none}}
</style>

tion-delay:1.38s"></i><i style="--dx:287px;--dy:-207px;--r:3deg;--c:#FF4FD8;width:9px;height:14px;animation-delay:1.39s"></i><i style="--dx:108px;--dy:-45px;--r:60deg;--c:#22D3EE;width:12px;height:10px;animation-delay:1.40s"></i><i style="--dx:179px;--dy:-72px;--r:117deg;--c:#C6FF3D;width:6px;height:14px;animation-delay:1.41s"></i></div>

<script>
(function(){
  var html=document.documentElement, reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var letters=[].slice.call(document.querySelectorAll('.l')), slots=[].slice.call(document.querySelectorAll('.slot'));
  var by=document.getElementById('by'), row=document.getElementById('row');
  var finished=false, timer=null;

  /* ---- WHEN THE INTRO PLAYS ----
     plays:     every fresh launch: opening the page again after it was closed, opening the installed Home Screen app,
                and the first launch after the app's data was cleared (new session = empty sessionStorage)
     NOT plays: a refresh / reload, the back button, moving around inside the app, switching away and back
     (sessionStorage survives a reload and is cleared when the tab or the installed app is closed) */
  function shouldPlay(){
    var navType='navigate';
    try{ var e=performance.getEntriesByType&&performance.getEntriesByType('navigation')[0]; if(e&&e.type) navType=e.type; }catch(x){}
    if(navType==='reload'||navType==='back_forward') return false;
    try{ if(sessionStorage.getItem('intro_seen')==='1') return false; }catch(x){}
    return true;
  }
  function markSeen(){ try{ sessionStorage.setItem('intro_seen','1'); }catch(x){} }

  /* ---- layout: where everything ends up (the final picture) ---- */
  var G={};
  function layout(){
    var W=innerWidth,H=innerHeight; G.W=W;G.H=H;
    var lw=Math.min(W*.82,380), lh=lw*500/900;
    G.Cx=W/2; G.Cy=H*.40; G.lw=lw; G.lh=lh;
    G.f=Math.max(24,Math.min(34,W*.075));           /* final (small) font size */
    G.F=Math.max(34,Math.min(62,W*.116));           /* big font size while arranging */
    row.style.top=(G.Cy+lh/2+58)+'px'; row.style.fontSize=G.f+'px';
    by.style.top=(G.Cy+lh/2+22)+'px';
    slots.forEach(function(s){s.style.width=(.82*G.f)+'px';s.style.height=G.f+'px';});
    letters.forEach(function(l){l.style.fontSize=G.f+'px';l.style.width=(.82*G.f)+'px';l.style.height=G.f+'px';});
    G.slot=slots.map(function(s){var r=s.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};});
    letters.forEach(function(l,i){l.style.left=(G.slot[i].x-.41*G.f)+'px';l.style.top=(G.slot[i].y-G.f/2)+'px';});
  }

  /* ---- the letters' journey (times in ms) ----
     0-1200   fallen letters rearrange toward the word, still unfinished when the logo lands
     1200     the Fiesta logo smashes in: letters are flung out
     1230-2500+ they ROTATE around and over the logo
     2500-3500 they fly down and arrange themselves under the logo   */
  var T_IMPACT=1200, T_ORBIT_END=2450, D=3600;
  function play(){
    layout();
    letters.forEach(function(l){l.getAnimations().forEach(function(a){a.cancel();});});
    if(reduce){return;}
    var s0=G.F/G.f, R=Math.min(G.W*.40,G.lw*.62), Cx=G.Cx, Cy=G.Cy;
    letters.forEach(function(el,i){
      var side=i%2?1:-1, F=G.slot[i];
      function tr(x,y,sc,rot){return 'translate('+(x-F.x)+'px,'+(y-F.y)+'px) rotate('+rot+'deg) scale('+sc+')';}
      var Wx=Cx+(i-3)*.82*G.F, Wy=Cy;                                  /* spot in the big word */
      var Px=Cx+(i-3)*.82*G.F*.35+side*G.F*(.35+.2*(i%3)), Py=Cy+G.F*(1.05+.12*(i%2));   /* fallen on the floor */
      var th0=i/7*Math.PI*2-Math.PI/2, tEnd=T_ORBIT_END+i*45;
      function orbit(u,k){var th=th0+u*Math.PI*2*1.5, rr=R*(k||1)*(.92+.08*Math.sin(u*Math.PI)); return {x:Cx+Math.cos(th)*rr, y:Cy+Math.sin(th)*rr*.62, th:th};}
      var kf=[]; function add(t,x,y,sc,rot,op,ease){kf.push({offset:t/D,transform:tr(x,y,sc,rot),opacity:op,easing:ease||'linear'});}
      add(0,Px,Py,s0,side*120,0);
      add(160,Px,Py,s0,side*120,1,'cubic-bezier(.3,.9,.4,1)');
      add(520,Px+(Wx-Px)*.25,Py+(Wy-Py)*.25-.75*G.F,s0,side*60,1,'cubic-bezier(.55,0,.9,.6)');
      add(800,Px+(Wx-Px)*.5,Py+(Wy-Py)*.5,s0,side*28,1,'cubic-bezier(.3,.9,.4,1)');
      add(1000,Px+(Wx-Px)*.65,Py+(Wy-Py)*.65-.5*G.F,s0,side*12,1,'ease-in');
      add(T_IMPACT-10,Px+(Wx-Px)*.8,Py+(Wy-Py)*.8,s0,side*6,1,'cubic-bezier(.1,.8,.3,1)');
      var o0=orbit(0,1.35); add(T_IMPACT+60,o0.x,o0.y,s0*.78,o0.th*57.3+90,1);       /* flung out by the smash */
      var n=Math.round((tEnd-(T_IMPACT+60))/90);
      for(var k=1;k<=n;k++){var u=k/n,o=orbit(u,1),t=T_IMPACT+60+k*((tEnd-(T_IMPACT+60))/n); add(t,o.x,o.y,s0*(.78-.1*u),o.th*57.3+90,1);}
      var oe=orbit(1,1);
      add(tEnd+380,(oe.x+F.x)/2,Math.min(oe.y,F.y)-40,s0*.55,20*side,1,'ease-out');
      add(tEnd+640,F.x,F.y+9,1.06,-6*side,1,'ease-out');
      add(tEnd+800,F.x,F.y,1,0,1);
      kf.forEach(function(k){k.offset=Math.min(1,k.offset);});
      var tot=tEnd+800, scale=D; /* offsets are relative to D; make the animation exactly D long */
      var arr=kf.filter(function(k){return k.offset<=1;});
      el.animate(arr,{duration:D,fill:'both',easing:'linear'});
    });
  }
  function finish(){ if(finished) return; finished=true; /* in the real app: go to the Welcome screen / Home */ }
  function start(){
    finished=false; clearTimeout(timer);
    html.classList.remove('play'); void document.body.offsetWidth; html.classList.add('play'); play();
    timer=setTimeout(finish,4600);
  }
  function skip(){ clearTimeout(timer); html.classList.remove('play'); letters.forEach(function(l){l.getAnimations().forEach(function(a){a.cancel();});}); layout(); finish(); }
  document.getElementById('skip').addEventListener('click',function(e){e.stopPropagation();skip();});
  document.getElementById('scene').addEventListener('click',function(){ if(!reduce) start(); });
  window.addEventListener('resize',function(){ if(!html.classList.contains('play')||finished){ layout(); } });
  var note=document.getElementById('note');
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
    var forced=/[?&]intro=1/.test(location.search);                 /* preview: ?intro=1 always plays */
    if(reduce){ html.classList.remove('play'); layout(); markSeen(); return; }
    if(forced||shouldPlay()){ markSeen(); start(); }
    else { html.classList.remove('play'); layout(); note.hidden=false; document.getElementById('skip').hidden=true; /* in the app: go straight to Home / Welcome */ }
  });
})();
</script>
